        let maxNum = students.length > 0 ? Math.max(...students.map(s => parseInt(s.id.replace('STU', ''), 10) || 0)) : 0;
        const existingUsns = new Set(students.map(s => s.usn?.toUpperCase()));
        const added = [];
        let skipped = 0;

        lines.forEach(line => {
          const parts = line.split(',').map(p => p.trim());
          if (parts.length < 2) return;
          const [rawUsn, rawName, rawEmail, rawPass, rawPhone] = parts;
          const usn = rawUsn.toUpperCase();
          if (!usn || !rawName || existingUsns.has(usn)) {
            skipped++;
            return;
          }
          existingUsns.add(usn);
          maxNum++;
          const slug = rawName.toLowerCase().replace(/[^a-z0-9]+/g, '.');
          added.push({
            id: `STU${String(maxNum).padStart(3, '0')}`,
            usn,
            name: rawName,
            email: rawEmail || `${slug}@gmu.edu`,
            password: rawPass || 'student123password',
            phone: rawPhone || '+91 90000 00000',
            department: 'CSE (CS2B)',
            year: 'III Sem (2026-27)',
            status: 'Active'
          });
        });

        if (added.length > 0) {
          setStudents([...students, ...added]);
        }
        setModalType(null);
        showToast(`Imported ${added.length} students${skipped > 0 ? ` (${skipped} duplicate/invalid skipped)` : ''}.`);

        const blob = new Blob([[header, ...rows].join('\n')], { type: 'text/csv;charset=utf-8;' });

        const link = document.createElement('a');
        link.href = url;
        link.setAttribute('download', 'GMU_CS2B_Students.csv');

          setAcademics(academics.map(a =>
            a.usn === usn && a.courseId === courseId
              ? { ...a, attended: a.attended + (isPresent ? 1 : 0), totalClasses: a.totalClasses + 1 }
              : a
          ));
        } else {
          setAcademics([
            ...academics,
            { id: `AC-${Date.now()}`, usn, courseId, attended: isPresent ? 1 : 0, totalClasses: 1, cie1: 0, cie2: 0 }
          ]);
        }
        showToast(`Marked ${isPresent ? 'Present' : 'Absent'} for ${usn}`);
      };

      const handleUpdateCieScore = (usn, courseId, field, rawVal) => {
        if (!permissions?.canEditAcademics) return;
        const val = Math.max(0, Math.min(25, Number(rawVal) || 0));
        const existing = academics.find(a => a.usn === usn && a.courseId === courseId);
        if (existing) {
          setAcademics(academics.map(a =>
            a.usn === usn && a.courseId === courseId ? { ...a, [field]: val } : a
          ));
        } else {
          setAcademics([
            ...academics,
            { id: `AC-${Date.now()}`, usn, courseId, attended: 24, totalClasses: 30, cie1: field === 'cie1' ? val : 0, cie2: field === 'cie2' ? val : 0 }
          ]);
        }
      };

      // --- SLOT-BASED BOOKING ENGINE ---
      const handleSimulateBooking = (e) => {
        e.preventDefault();
        const targetRes = resources.find(r => r.id === bookingDetails.resourceId);
        if (!targetRes) return;

        if (targetRes.status === 'Maintenance') {
          setBookingStatusMsg({
            type: 'error',
            text: `Booking Declined: ${targetRes.name} is currently under Maintenance.`
          });
          return;
        }

        const conflict = bookings.find(
          b =>
            b.resourceId === targetRes.id &&
            b.date === bookingDetails.date &&
            b.timeSlot === bookingDetails.timeSlot &&
            b.status !== 'Rejected'
        );

        if (conflict) {
          setBookingStatusMsg({
            type: 'error',
            text: `Slot Conflict: ${targetRes.name} is already booked on ${bookingDetails.date} (${bookingDetails.timeSlot}) by ${conflict.bookedBy}.`
          });
          return;
        }

        const newBooking = {
          id: `BK-${String(bookings.length + 101)}`,
          resourceId: targetRes.id,
          resourceName: targetRes.name,
          bookedBy: bookingDetails.user || currentUser.name,
          role: currentUser.role,
          date: bookingDetails.date,
          timeSlot: bookingDetails.timeSlot,
          purpose: bookingDetails.purpose.trim() || 'Academic / Lab Session',
          status: permissions.canApproveBookings ? 'Approved' : 'Pending'
        };

        setBookings([newBooking, ...bookings]);
        setBookingDetails(prev => ({ ...prev, purpose: '' }));
        setBookingStatusMsg({
          type: 'success',
          text: permissions.canApproveBookings
            ? `Reservation Approved! ${targetRes.name} booked for ${newBooking.date} (${newBooking.timeSlot}).`
            : `Reservation Request Submitted! Awaiting Admin/Staff approval for ${targetRes.name}.`
        });
        setTimeout(() => setBookingStatusMsg(null), 4500);
      };

      const handleBookingStatusChange = (bookingId, newStatus) => {
        if (!permissions?.canApproveBookings) return;
        setBookings(bookings.map(b => (b.id === bookingId ? { ...b, status: newStatus } : b)));
        showToast(`Booking ${bookingId} marked as ${newStatus}.`);
      };

      const handleCancelBooking = (bookingId) => {
        setBookings(bookings.filter(b => b.id !== bookingId));
        showToast(`Booking ${bookingId} cancelled.`);
      };

      // --- NOTICE BOARD CRUD ---
      const handleAddNotice = (e) => {
        e.preventDefault();
        if (!permissions?.canPostNotices) return;
        const created = {
          id: `NOT-${String(notices.length + 1).padStart(2, '0')}`,
          title: newNotice.title.trim(),
          courseCode: newNotice.courseCode,
          category: newNotice.category,
          author: `${currentUser.name} (${currentUser.role})`,
          date: '2026-11-25',
          dueDate: newNotice.dueDate || '2026-12-10',
          content: newNotice.content.trim()
        };
        setNotices([created, ...notices]);
        setModalType(null);
        setNewNotice({ title: '', courseCode: 'UE25CS2304', category: 'Circular', dueDate: '2026-12-05', content: '' });
        showToast('Circular / Study Material published.');
      };

      const handleDeleteNotice = (id) => {
        if (!permissions?.canPostNotices) return;
        setNotices(notices.filter(n => n.id !== id));
      };

      // Filtered Lists
      const filteredStudents = useMemo(() => students.filter(s =>
        (s.usn && s.usn.toLowerCase().includes(searchQuery.toLowerCase())) ||
        s.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
        s.id.toLowerCase().includes(searchQuery.toLowerCase()) ||
        s.department.toLowerCase().includes(searchQuery.toLowerCase())
      ), [students, searchQuery]);

      const filteredFaculty = useMemo(() => faculty.filter(f =>
        f.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
        f.id.toLowerCase().includes(searchQuery.toLowerCase()) ||
        (f.courseCoordinator && f.courseCoordinator.toLowerCase().includes(searchQuery.toLowerCase()))
      ), [faculty, searchQuery]);

      const filteredCourses = useMemo(() => courses.filter(c =>
        c.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
        c.id.toLowerCase().includes(searchQuery.toLowerCase()) ||
        c.faculty.toLowerCase().includes(searchQuery.toLowerCase())
      ), [courses, searchQuery]);

      const filteredResources = useMemo(() => resources.filter(r =>
        r.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
        r.category.toLowerCase().includes(searchQuery.toLowerCase())
      ), [resources, searchQuery]);

      const filteredActivities = useMemo(() => activities.filter(a =>
        a.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
        a.venue.toLowerCase().includes(searchQuery.toLowerCase())
      ), [activities, searchQuery]);

      const filteredNotices = useMemo(() => notices.filter(n =>
        (selectedNoticeCourse === 'ALL' || n.courseCode === selectedNoticeCourse || n.courseCode === 'ALL') &&
        (n.title.toLowerCase().includes(searchQuery.toLowerCase()) ||
          n.content.toLowerCase().includes(searchQuery.toLowerCase()) ||
          n.courseCode.toLowerCase().includes(searchQuery.toLowerCase()))
      ), [notices, selectedNoticeCourse, searchQuery]);

      const totalCourseCredits = useMemo(
        () => courses.reduce((sum, c) => sum + (Number(c.credits) || 0), 0),
        [courses]
      );

      // Student personal academic summary
      const studentPersonalSummary = useMemo(() => {
        if (!currentUser || currentUser.role !== 'Student' || !currentUser.usn) return [];
        return courses.slice(0, 4).map(c => {
          const rec = getAcademicRecord(currentUser.usn, c.id);
          const pct = rec.totalClasses > 0 ? Math.round((rec.attended / rec.totalClasses) * 100) : 0;
          return { course: c, ...rec, pct };
        });
      }, [currentUser, courses, academics]);

      // --- LOGIN SCREEN ---
      if (!currentUser) {
        return (
          <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4 relative overflow-hidden">
            <div className="absolute -top-40 -left-40 w-96 h-96 bg-indigo-600/20 rounded-full blur-3xl pointer-events-none"></div>
            <div className="absolute -bottom-40 -right-40 w-96 h-96 bg-blue-600/20 rounded-full blur-3xl pointer-events-none"></div>

            <div className="w-full max-w-4xl bg-slate-800 border border-slate-700/80 rounded-2xl shadow-2xl overflow-hidden grid grid-cols-1 md:grid-cols-12 z-10 animate-fade-in">
              <div className="md:col-span-5 bg-gradient-to-br from-indigo-900 via-slate-900 to-indigo-950 p-8 text-white flex flex-col justify-between border-b md:border-b-0 md:border-r border-slate-700/80">
                <div>
                  <div className="flex items-center space-x-3 mb-6">
                    <div className="p-3 bg-indigo-600 rounded-xl text-white shadow-lg shadow-indigo-600/40">
                      <Icon name="layers" className="w-7 h-7" />
                    </div>
                    <div>
                      <h1 className="text-xl font-bold tracking-tight text-white">SmartCampus</h1>
                      <p className="text-xs text-indigo-300 font-medium">GM University • III Sem CSE (CS2B)</p>
                    </div>
                  </div>

                  <p className="text-xs text-slate-300 leading-relaxed mb-6">
                    Complete ERP & Academic Portal featuring USN Student Login, Weekly Timetable, Attendance & CIE Marks, Slot Bookings, and Study Circulars.
                  </p>

                  <div className="space-y-2.5">
                    <div className="flex items-center space-x-2.5 text-xs text-slate-300">
                      <Icon name="id-card" className="w-4 h-4 text-blue-400" />
                      <span>Student sign in via USN Number or Email</span>
                    </div>
                    <div className="flex items-center space-x-2.5 text-xs text-slate-300">
                      <Icon name="clipboard" className="w-4 h-4 text-emerald-400" />
                      <span>Live Attendance & Term Exam I/II CIE Marks</span>
                    </div>
                    <div className="flex items-center space-x-2.5 text-xs text-slate-300">
                      <Icon name="clock" className="w-4 h-4 text-amber-400" />
                      <span>CS2B Weekly Timetable & Slot Conflict Booking</span>
                    </div>
                  </div>
                </div>

                <div className="mt-8 pt-4 border-t border-slate-800 text-[11px] text-slate-400">
                  Students can log in using their assigned <strong>USN Number</strong> (e.g. <span className="font-mono text-indigo-300">24GMU23CS001</span>) and password.
                </div>
              </div>

              <div className="md:col-span-7 p-8 bg-slate-800 flex flex-col justify-between space-y-6">
                <div>
                  <div className="mb-6">
                    <h2 className="text-xl font-bold text-white">Account Sign In</h2>
                    <p className="text-xs text-slate-400 mt-1">
                      Students: Enter your <strong>USN Number</strong> (or Email/Name) and Password. Faculty/Staff/Admin: Enter Email or Name.
                    </p>
                  </div>

                  {authError && (
                    <div className="mb-4 p-3 rounded-lg bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs font-medium flex items-center gap-2">
                      <Icon name="alert-circle" className="w-4 h-4 text-rose-400 flex-shrink-0" />
                      <span>{authError}</span>
                    </div>
                  )}

                  <form onSubmit={handleLogin} className="space-y-3.5">
                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">Student USN / Email / Name</label>
                      <div className="relative">
                        <Icon name="id-card" className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                        <input
                          type="text"
                          placeholder="e.g. 24GMU23CS001 or admin@campus.edu"
                          value={loginIdentifier}
                          onChange={(e) => setLoginIdentifier(e.target.value)}
                          className="w-full pl-9 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        />
                      </div>
                    </div>

                    <div>
                      <label className="block text-xs font-semibold text-slate-300 mb-1">Security Password</label>
                      <div className="relative">
                        <Icon name="key" className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                        <input
                          type="password"
                          placeholder="Enter assigned password"
                          value={loginPassword}
                          onChange={(e) => setLoginPassword(e.target.value)}
                          className="w-full pl-9 pr-4 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-xs text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                        />
                      </div>
                    </div>

                    <button
                      type="submit"
                      className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-semibold text-xs rounded-lg transition-all shadow-lg shadow-indigo-600/30"
                    >
                      Sign In to System Portal
                    </button>
                  </form>
                </div>

                <div className="pt-4 border-t border-slate-700/60">
                  <p className="text-[11px] font-semibold text-slate-400 uppercase tracking-wider mb-2.5">
                    Quick Demo Role Select (One-Click)
                  </p>
                  <div className="grid grid-cols-2 gap-2">
                    {DEMO_ACCOUNTS.map((acc) => (
                      <button
                        type="button"
                        key={acc.role}
                        onClick={() => loginAsUser(acc)}
                        className="p-2.5 bg-slate-900/80 hover:bg-slate-700 border border-slate-700 rounded-xl text-left transition-all group flex items-center justify-between"
                      >
                        <div className="min-w-0">
                          <div className="flex items-center space-x-1.5">
                            <span className={`w-2 h-2 rounded-full ${acc.avatarColor}`}></span>
                            <p className="text-xs font-bold text-white group-hover:text-indigo-300 transition-colors">{acc.role}</p>
                          </div>
                          <p className="text-[10px] text-slate-400 truncate mt-0.5 font-mono">
                            {acc.usn ? `${acc.usn} (${acc.name})` : acc.email}
                          </p>
                        </div>
                        <Icon name="arrow-right" className="w-3.5 h-3.5 text-slate-500 group-hover:text-white transition-colors" />
                      </button>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      const pendingBookingsCount = bookings.filter(b => b.status === 'Pending').length;

      return (
        <div className="min-h-screen bg-slate-50 text-slate-800 font-sans flex flex-col md:flex-row">
          {/* SIDEBAR */}
          <aside className="w-full md:w-72 bg-slate-900 text-slate-100 flex-shrink-0 flex flex-col justify-between border-r border-slate-800">
            <div>
              <div className="p-5 border-b border-slate-800 flex items-center space-x-3">
                <div className="p-2.5 bg-indigo-600 rounded-xl text-white shadow-lg shadow-indigo-600/30">
                  <Icon name="layers" className="w-6 h-6" />
                </div>
                <div>
                  <h1 className="font-bold text-lg leading-tight text-white">SmartCampus</h1>
                  <p className="text-xs text-slate-400 font-medium">III Sem CSE • CS2B</p>
                </div>
              </div>

              <div className="p-3.5 mx-4 my-3 bg-slate-800/80 rounded-xl border border-slate-700/60">
                <div className="flex items-center justify-between mb-1">
                  <span className="text-[10px] font-semibold text-slate-400 uppercase tracking-wider">Active Role</span>
                  <span className={`text-[10px] font-bold px-2 py-0.5 rounded border ${currentUser.badgeColor}`}>
                    {currentUser.role}
                  </span>
                </div>
                <p className="text-xs text-white font-bold truncate">{currentUser.name}</p>
                {currentUser.usn && (
                  <p className="text-[11px] font-mono text-indigo-300 truncate mt-0.5">USN: {currentUser.usn}</p>
                )}
              </div>

              <nav className="px-3 space-y-1">
                <div className="px-3 pb-1 text-[10px] font-semibold text-slate-400 uppercase tracking-wider">Academics & Schedule</div>
                <button type="button" onClick={() => setActiveTab('dashboard')} className={`w-full flex items-center space-x-3 px-3 py-2 rounded-lg text-xs font-semibold transition-colors ${activeTab === 'dashboard' ? 'bg-indigo-600/20 text-indigo-400 border border-indigo-500/30' : 'text-slate-300 hover:bg-slate-800'}`}>
                  <Icon name="activity" className="w-4 h-4" />
                  <span>Dashboard Overview</span>
                </button>
                <button type="button" onClick={() => setActiveTab('timetable')} className={`w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-semibold transition-colors ${activeTab === 'timetable' ? 'bg-cyan-500/20 text-cyan-400 border border-cyan-500/30' : 'text-slate-300 hover:bg-slate-800'}`}>
                  <div className="flex items-center space-x-3">
                    <Icon name="clock" className="w-4 h-4 text-cyan-400" />
                    <span>Weekly Timetable</span>
                  </div>
                  <span className="text-[10px] px-1.5 py-0.5 rounded bg-slate-800 text-slate-400">CS2B</span>
                </button>
                <button type="button" onClick={() => setActiveTab('academics')} className={`w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-semibold transition-colors ${activeTab === 'academics' ? 'bg-teal-500/20 text-teal-400 border border-teal-500/30' : 'text-slate-300 hover:bg-slate-800'}`}>
                  <div className="flex items-center space-x-3">
                    <Icon name="clipboard" className="w-4 h-4 text-teal-400" />
                    <span>Attendance & CIE Marks</span>
                  </div>
                </button>
                <button type="button" onClick={() => setActiveTab('notices')} className={`w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-semibold transition-colors ${activeTab === 'notices' ? 'bg-orange-500/20 text-orange-400 border border-orange-500/30' : 'text-slate-300 hover:bg-slate-800'}`}>
                  <div className="flex items-center space-x-3">
                    <Icon name="megaphone" className="w-4 h-4 text-orange-400" />
                    <span>Notices & Study Hub</span>
                  </div>
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">{notices.length}</span>
                </button>

                <div className="px-3 pt-3 pb-1 text-[10px] font-semibold text-slate-400 uppercase tracking-wider">Campus Administration</div>
                <button type="button" onClick={() => setActiveTab('students')} className={`w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-semibold transition-colors ${activeTab === 'students' ? 'bg-blue-500/20 text-blue-400 border border-blue-500/30' : 'text-slate-300 hover:bg-slate-800'}`}>
                  <div className="flex items-center space-x-3">
                    <Icon name="users" className="w-4 h-4 text-blue-400" />
                    <span>Student Directory</span>
                  </div>
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">{students.length}</span>
                </button>
                <button type="button" onClick={() => setActiveTab('faculty')} className={`w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-semibold transition-colors ${activeTab === 'faculty' ? 'bg-rose-500/20 text-rose-400 border border-rose-500/30' : 'text-slate-300 hover:bg-slate-800'}`}>
                  <div className="flex items-center space-x-3">
                    <Icon name="user-check" className="w-4 h-4 text-rose-400" />
                    <span>Faculty Directory</span>
                  </div>
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">{faculty.length}</span>
                </button>
                <button type="button" onClick={() => setActiveTab('courses')} className={`w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-semibold transition-colors ${activeTab === 'courses' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : 'text-slate-300 hover:bg-slate-800'}`}>
                  <div className="flex items-center space-x-3">
                    <Icon name="book-open" className="w-4 h-4 text-amber-400" />
                    <span>Course Curriculum</span>
                  </div>
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">{courses.length}</span>
                </button>
                <button type="button" onClick={() => setActiveTab('resources')} className={`w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-semibold transition-colors ${activeTab === 'resources' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'text-slate-300 hover:bg-slate-800'}`}>
                  <div className="flex items-center space-x-3">
                    <Icon name="box" className="w-4 h-4 text-emerald-400" />
                    <span>Facilities & Rooms</span>
                  </div>
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">{resources.length}</span>
                </button>
                <button type="button" onClick={() => setActiveTab('bookings')} className={`w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-semibold transition-colors ${activeTab === 'bookings' ? 'bg-indigo-600/20 text-indigo-400 border border-indigo-500/30' : 'text-slate-300 hover:bg-slate-800'}`}>
                  <div className="flex items-center space-x-3">
                    <Icon name="bookmark" className="w-4 h-4 text-indigo-400" />
                    <span>Slot Bookings</span>
                  </div>
                  {pendingBookingsCount > 0 && (
                    <span className="text-[10px] px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 border border-amber-500/30">{pendingBookingsCount}</span>
                  )}
                </button>
                <button type="button" onClick={() => setActiveTab('activities')} className={`w-full flex items-center justify-between px-3 py-2 rounded-lg text-xs font-semibold transition-colors ${activeTab === 'activities' ? 'bg-purple-500/20 text-purple-400 border border-purple-500/30' : 'text-slate-300 hover:bg-slate-800'}`}>
                  <div className="flex items-center space-x-3">
                    <Icon name="calendar" className="w-4 h-4 text-purple-400" />
                    <span>Exams & Events</span>
                  </div>
                  <span className="text-[10px] px-2 py-0.5 rounded-full bg-slate-800 text-slate-400">{activities.length}</span>
                </button>
              </nav>
            </div>

            <div className="p-4 border-t border-slate-800 mt-4">
              <button
                type="button"
                onClick={handleLogout}
                className="w-full flex items-center justify-center space-x-2 px-3 py-2 bg-slate-800 hover:bg-rose-500/20 hover:text-rose-400 text-slate-300 rounded-lg text-xs font-semibold transition-colors"
              >
                <Icon name="log-out" className="w-4 h-4" />
                <span>Sign Out ({currentUser.role})</span>
              </button>
            </div>
          </aside>

          {/* MAIN CONTENT */}
          <main className="flex-1 flex flex-col min-w-0">
            {/* TOP HEADER */}
            <header className="bg-white border-b border-slate-200 px-6 py-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4">
              <div>
                <h2 className="text-base font-bold text-slate-800 capitalize">
                  {activeTab === 'dashboard' ? 'System Dashboard & Operations' : `${activeTab.replace('-', ' ')} Module`}
                </h2>
                <p className="text-xs text-slate-500">
                  Welcome, <strong className="text-slate-700">{currentUser.name}</strong>{currentUser.usn ? ` (${currentUser.usn})` : ''} • GM University • III Sem CSE (CS2B) • Room C-214
                </p>
              </div>

              <div className="flex items-center space-x-3 w-full sm:w-auto">
                <div className="relative flex-1 sm:w-64">
                  <Icon name="search" className="w-4 h-4 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
                  <input
                    type="text"
                    placeholder="Search USN, course, notice..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full pl-9 pr-4 py-2 bg-slate-100 border border-slate-200 rounded-lg text-xs text-slate-800 focus:outline-none focus:ring-2 focus:ring-indigo-500"
                  />
                </div>
              </div>
            </header>

            {toastMsg && (
              <div className={`mx-6 mt-4 px-4 py-2.5 rounded-xl text-xs font-semibold border animate-fade-in ${
                toastMsg.type === 'error' ? 'bg-rose-50 border-rose-200 text-rose-700' : 'bg-emerald-50 border-emerald-200 text-emerald-700'
              }`}>
                {toastMsg.text}
              </div>
            )}

            {/* TAB PANELS */}
            <div className="p-6 overflow-y-auto flex-1 space-y-6">
              
              {/* --- DASHBOARD OVERVIEW --- */}
              {activeTab === 'dashboard' && (
                <div className="space-y-6 animate-fade-in">
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                    <button type="button" onClick={() => setActiveTab('students')} className="bg-white p-5 rounded-2xl border border-slate-200 hover:border-blue-300 shadow-sm flex items-center justify-between text-left transition-all group">
                      <div>
                        <p className="text-[11px] font-bold text-slate-400 uppercase tracking-wider group-hover:text-blue-600">Enrolled Students</p>
                        <p className="text-2xl font-black text-slate-800 mt-1">{students.length}</p>
                        <span className="text-[10px] text-emerald-600 font-semibold mt-1 inline-block">USN + CSV Import →</span>
                      </div>
                      <div className="p-3 bg-blue-50 text-blue-600 rounded-xl"><Icon name="users" className="w-6 h-6" /></div>
                    </button>

                    <button type="button" onClick={() => setActiveTab('timetable')} className="bg-white p-5 rounded-2xl border border-slate-200 hover:border-cyan-300 shadow-sm flex items-center justify-between text-left transition-all group">
                      <div>
                        <p className="text-[11px] font-bold text-slate-400 uppercase tracking-wider group-hover:text-cyan-600">Weekly Schedule</p>
                        <p className="text-2xl font-black text-slate-800 mt-1">30 <span className="text-xs font-semibold text-slate-500">Periods</span></p>
                        <span className="text-[10px] text-cyan-600 font-semibold mt-1 inline-block">Mon–Sat C-214 →</span>
                      </div>
                      <div className="p-3 bg-cyan-50 text-cyan-600 rounded-xl"><Icon name="clock" className="w-6 h-6" /></div>
                    </button>

                    <button type="button" onClick={() => setActiveTab('academics')} className="bg-white p-5 rounded-2xl border border-slate-200 hover:border-teal-300 shadow-sm flex items-center justify-between text-left transition-all group">
                      <div>
                        <p className="text-[11px] font-bold text-slate-400 uppercase tracking-wider group-hover:text-teal-600">Attendance & CIE</p>
                        <p className="text-2xl font-black text-slate-800 mt-1">{courses.length} <span className="text-xs font-semibold text-slate-500">Subjects</span></p>
                        <span className="text-[10px] text-teal-600 font-semibold mt-1 inline-block">Term I & II Marks →</span>
                      </div>
                      <div className="p-3 bg-teal-50 text-teal-600 rounded-xl"><Icon name="clipboard" className="w-6 h-6" /></div>
                    </button>

                    <button type="button" onClick={() => setActiveTab('bookings')} className="bg-white p-5 rounded-2xl border border-slate-200 hover:border-indigo-300 shadow-sm flex items-center justify-between text-left transition-all group">
                      <div>
                        <p className="text-[11px] font-bold text-slate-400 uppercase tracking-wider group-hover:text-indigo-600">Slot Bookings</p>
                        <p className="text-2xl font-black text-slate-800 mt-1">{bookings.length}</p>
                        <span className="text-[10px] text-indigo-600 font-semibold mt-1 inline-block">{pendingBookingsCount} pending approval →</span>
                      </div>
                      <div className="p-3 bg-indigo-50 text-indigo-600 rounded-xl"><Icon name="bookmark" className="w-6 h-6" /></div>
                    </button>
                  </div>

                  {/* Student Personal USN Academic Card when logged in as Student */}
                  {currentUser.role === 'Student' && studentPersonalSummary.length > 0 && (
                    <div className="bg-white rounded-2xl border border-blue-200 p-6 shadow-sm">
                      <div className="flex items-center justify-between mb-4">
                        <div>
                          <h3 className="text-sm font-bold text-slate-800">My Academic Snapshot — USN: <span className="font-mono text-blue-700">{currentUser.usn}</span></h3>
                          <p className="text-xs text-slate-500">Core III Sem CSE subjects attendance & internal assessment summary</p>
                        </div>
                        <button type="button" onClick={() => setActiveTab('academics')} className="text-xs font-semibold text-blue-600 hover:underline">Full Report →</button>
                      </div>
                      <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                        {studentPersonalSummary.map(item => (
                          <div key={item.course.id} className="p-3.5 rounded-xl bg-slate-50 border border-slate-200">
                            <span className="text-[10px] font-mono font-bold text-indigo-600">{item.course.id}</span>
                            <p className="text-xs font-bold text-slate-800 truncate mt-0.5">{item.course.title}</p>
                            <div className="mt-2.5 flex items-center justify-between text-xs">
                              <span className="text-slate-500">Attendance:</span>
                              <span className={`font-bold ${item.pct >= 75 ? 'text-emerald-600' : 'text-rose-600'}`}>{item.pct}% ({item.attended}/{item.totalClasses})</span>
                            </div>
                            <div className="mt-1 flex items-center justify-between text-xs">
                              <span className="text-slate-500">CIE-I / CIE-II:</span>
                              <span className="font-bold text-slate-800">{item.cie1}/25 • {item.cie2}/25</span>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                    <div className="lg:col-span-7 bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
                      <div className="flex items-center justify-between mb-4">
                        <h3 className="text-sm font-bold text-slate-800">Latest Circulars & Assignment Deadlines</h3>
                        <button type="button" onClick={() => setActiveTab('notices')} className="text-xs font-semibold text-indigo-600 hover:underline">Open Notice Hub</button>
                      </div>
                      <div className="space-y-3">
                        {notices.slice(0, 3).map(n => (
                          <div key={n.id} className="p-3.5 bg-slate-50 border border-slate-200/80 rounded-xl flex items-start justify-between gap-3">
                            <div>
                              <div className="flex items-center gap-2">
                                <span className="text-[10px] font-mono font-bold px-2 py-0.5 rounded bg-indigo-100 text-indigo-700">{n.courseCode}</span>
                                <span className="text-[10px] font-semibold text-slate-500">{n.category} • Due: {n.dueDate}</span>
                              </div>
                              <p className="text-xs font-bold text-slate-800 mt-1">{n.title}</p>
                              <p className="text-[11px] text-slate-500 mt-0.5 line-clamp-1">{n.content}</p>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>

                    <div className="lg:col-span-5 bg-white rounded-2xl border border-slate-200 p-6 shadow-sm flex flex-col justify-between">
                      <div>
                        <h3 className="text-sm font-bold text-slate-800 mb-2">Wednesday CS2B Schedule Preview</h3>
                        <p className="text-xs text-slate-500 mb-3">Room C-214 & Batch B1/B2 Lab Rotation</p>
                        <div className="space-y-2">
                          {timetable.filter(t => t.day === 'Wednesday').slice(0, 4).map(slot => (
                            <div key={slot.id} className="flex items-center justify-between text-xs p-2 rounded-lg bg-slate-50 border border-slate-200/70">
                              <span className="font-mono text-[11px] text-slate-500">{slot.slot.split(' - ')[0]}</span>
                              <span className="font-bold text-slate-800">{slot.subject}</span>
                              <span className="text-[11px] text-indigo-600 font-medium">{slot.room}</span>
                            </div>
                          ))}
                        </div>
                      </div>
                      <button type="button" onClick={() => setActiveTab('timetable')} className="mt-4 w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold transition-all">
                        Open Full Weekly Timetable
                      </button>
                    </div>
                  </div>
                </div>
              )}

              {/* --- 1. INTERACTIVE WEEKLY TIMETABLE TAB --- */}
              {activeTab === 'timetable' && (
                <div className="space-y-4 animate-fade-in">
                  <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                    <div>
                      <h3 className="text-sm font-bold text-slate-800">III Sem CSE (CS2B) Weekly Class Timetable</h3>
                      <p className="text-xs text-slate-500">Room C-214 & Batch B1 / B2 Practical Labs. {permissions.canEditTimetable ? 'Click Edit on any slot to reassign.' : 'Read-only student schedule.'}</p>
                    </div>
                    <div className="flex flex-wrap gap-1.5">
                      {DAYS.map(day => (
                        <button
                          key={day}
                          type="button"
                          onClick={() => setSelectedDay(day)}
                          className={`px-3 py-1.5 rounded-lg text-xs font-semibold transition-colors ${
                            selectedDay === day ? 'bg-indigo-600 text-white shadow-sm' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-100'
                          }`}
                        >
                          {day}
                        </button>
                      ))}
                    </div>
                  </div>

                  <div className="bg-white rounded-2xl border border-slate-200 overflow-x-auto shadow-sm">
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase font-semibold">
                        <tr>
                          <th className="p-4">Time Slot</th>
                          <th className="p-4">Subject Code</th>
                          <th className="p-4">Course / Lab Session</th>
                          <th className="p-4">Faculty</th>
                          <th className="p-4">Room / Lab</th>
                          <th className="p-4">Batch</th>
                          {permissions.canEditTimetable && <th className="p-4 text-right">Action</th>}
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-200">
                        {timetable.filter(t => t.day === selectedDay).map(slot => (
                          <tr key={slot.id} className="hover:bg-slate-50/80 transition-colors">
                            <td className="p-4 font-mono font-semibold text-slate-700">{slot.slot}</td>
                            <td className="p-4 font-mono font-bold text-indigo-600">{slot.code}</td>
                            <td className="p-4 font-bold text-slate-800">{slot.subject}</td>
                            <td className="p-4 text-slate-600">{slot.faculty}</td>
                            <td className="p-4 text-slate-600 font-medium">{slot.room}</td>
                            <td className="p-4">
                              <span className={`px-2 py-0.5 rounded text-[10px] font-bold border ${
                                slot.batch === 'All' ? 'bg-slate-100 text-slate-700 border-slate-200' : 'bg-amber-50 text-amber-700 border-amber-200'
                              }`}>{slot.batch}</span>
                            </td>
                            {permissions.canEditTimetable && (
                              <td className="p-4 text-right">
                                <button
                                  type="button"
                                  onClick={() => { setEditingSlot(slot); setModalType('editTimetableSlot'); }}
                                  className="inline-flex items-center gap-1 px-2.5 py-1.5 bg-slate-100 hover:bg-indigo-50 text-slate-700 hover:text-indigo-600 rounded font-semibold text-[11px]"
                                >
                                  <Icon name="edit" className="w-3.5 h-3.5" />
                                  <span>Edit</span>
                                </button>
                              </td>
                            )}
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* --- 2. STUDENT USN ATTENDANCE & CIE MARKS TRACKER --- */}
              {activeTab === 'academics' && (
                <div className="space-y-4 animate-fade-in">
                  {currentUser.role === 'Student' ? (
                    <div className="space-y-4">
                      <div>
                        <h3 className="text-sm font-bold text-slate-800">My Attendance & Internal Assessment (CIE) Report</h3>
                        <p className="text-xs text-slate-500">Student: <strong>{currentUser.name}</strong> • USN: <strong className="font-mono text-blue-700">{currentUser.usn}</strong> • Minimum 75% attendance required.</p>
                      </div>
                      <div className="bg-white rounded-2xl border border-slate-200 overflow-x-auto shadow-sm">
                        <table className="w-full text-left text-xs">
                          <thead className="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase font-semibold">
                            <tr>
                              <th className="p-4">Subject Code & Title</th>
                              <th className="p-4">Coordinator</th>
                              <th className="p-4">Classes Attended</th>
                              <th className="p-4">Attendance %</th>
                              <th className="p-4">Term Exam - I (25)</th>
                              <th className="p-4">Term Exam - II (25)</th>
                              <th className="p-4">Average CIE</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-200">
                            {courses.slice(0, 5).map(c => {
                              const rec = getAcademicRecord(currentUser.usn, c.id);
                              const pct = rec.totalClasses > 0 ? Math.round((rec.attended / rec.totalClasses) * 100) : 0;
                              const avg = ((Number(rec.cie1) + Number(rec.cie2)) / 2).toFixed(1);
                              return (
                                <tr key={c.id} className="hover:bg-slate-50">
                                  <td className="p-4">
                                    <span className="font-mono font-bold text-indigo-600 block">{c.id}</span>
                                    <span className="font-bold text-slate-800">{c.title}</span>
                                  </td>
                                  <td className="p-4 text-slate-600">{c.faculty}</td>
                                  <td className="p-4 font-semibold text-slate-700">{rec.attended} / {rec.totalClasses}</td>
                                  <td className="p-4">
                                    <span className={`px-2.5 py-0.5 rounded-full text-[11px] font-bold border ${
                                      pct >= 75 ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-rose-50 text-rose-700 border-rose-200'
                                    }`}>
                                      {pct}% {pct < 75 ? '(Shortage)' : '(Eligible)'}
                                    </span>
                                  </td>
                                  <td className="p-4 font-bold text-slate-800">{rec.cie1} / 25</td>
                                  <td className="p-4 font-bold text-slate-800">{rec.cie2} / 25</td>
                                  <td className="p-4 font-bold text-indigo-700">{avg} / 25</td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  ) : (
                    <div className="space-y-4">
                      <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3">
                        <div>
                          <h3 className="text-sm font-bold text-slate-800">Subject Attendance & CIE Marks Register</h3>
                          <p className="text-xs text-slate-500">
                            {permissions.canEditAcademics
                              ? 'Mark live attendance (+Present / +Absent) and enter Term Exam I & II scores (max 25).'
                              : 'View-only attendance and internal assessment register.'}
                          </p>
                        </div>
                        <select
                          value={selectedAcademicCourse}
                          onChange={(e) => setSelectedAcademicCourse(e.target.value)}
                          className="px-3 py-2 bg-white border border-slate-200 rounded-lg text-xs font-bold text-slate-800 focus:ring-2 focus:ring-indigo-500"
                        >
                          {courses.map(c => (
                            <option key={c.id} value={c.id}>{c.id} — {c.title}</option>
                          ))}
                        </select>
                      </div>

                      <div className="bg-white rounded-2xl border border-slate-200 overflow-x-auto shadow-sm">
                        <table className="w-full text-left text-xs">
                          <thead className="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase font-semibold">
                            <tr>
                              <th className="p-4">USN Number</th>
                              <th className="p-4">Student Name</th>
                              <th className="p-4">Attended / Total</th>
                              <th className="p-4">Attendance %</th>
                              {permissions.canEditAcademics && <th className="p-4">Mark Attendance</th>}
                              <th className="p-4">Term Exam - I (25)</th>
                              <th className="p-4">Term Exam - II (25)</th>
                            </tr>
                          </thead>
                          <tbody className="divide-y divide-slate-200">
                            {students.map(s => {
                              const rec = getAcademicRecord(s.usn, selectedAcademicCourse);
                              const pct = rec.totalClasses > 0 ? Math.round((rec.attended / rec.totalClasses) * 100) : 0;
                              return (
                                <tr key={s.id} className="hover:bg-slate-50">
                                  <td className="p-4 font-mono font-bold text-blue-700">{s.usn}</td>
                                  <td className="p-4 font-bold text-slate-800">{s.name}</td>
                                  <td className="p-4 font-semibold text-slate-700">{rec.attended} / {rec.totalClasses}</td>
                                  <td className="p-4">
                                    <span className={`px-2 py-0.5 rounded text-[11px] font-bold border ${
                                      pct >= 75 ? 'bg-emerald-50 text-emerald-700 border-emerald-200' : 'bg-rose-50 text-rose-700 border-rose-200'
                                    }`}>{pct}%</span>
                                  </td>
                                  {permissions.canEditAcademics && (
                                    <td className="p-4 space-x-1.5">
                                      <button
                                        type="button"
                                        onClick={() => handleMarkAttendance(s.usn, selectedAcademicCourse, true)}
                                        className="px-2.5 py-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-700 border border-emerald-200 rounded font-bold text-[11px]"
                                      >
                                        + Present
                                      </button>
                                      <button
                                        type="button"
                                        onClick={() => handleMarkAttendance(s.usn, selectedAcademicCourse, false)}
                                        className="px-2.5 py-1 bg-rose-50 hover:bg-rose-100 text-rose-700 border border-rose-200 rounded font-bold text-[11px]"
                                      >
                                        + Absent
                                      </button>
                                    </td>
                                  )}
                                  <td className="p-4">
                                    {permissions.canEditAcademics ? (
                                      <input
                                        type="number"
                                        min="0"
                                        max="25"
                                        value={rec.cie1}
                                        onChange={(e) => handleUpdateCieScore(s.usn, selectedAcademicCourse, 'cie1', e.target.value)}
                                        className="w-16 px-2 py-1 bg-slate-50 border border-slate-300 rounded text-xs font-bold text-center"
                                      />
                                    ) : (
                                      <span className="font-bold">{rec.cie1} / 25</span>
                                    )}
                                  </td>
                                  <td className="p-4">
                                    {permissions.canEditAcademics ? (
                                      <input
                                        type="number"
                                        min="0"
                                        max="25"
                                        value={rec.cie2}
                                        onChange={(e) => handleUpdateCieScore(s.usn, selectedAcademicCourse, 'cie2', e.target.value)}
                                        className="w-16 px-2 py-1 bg-slate-50 border border-slate-300 rounded text-xs font-bold text-center"
                                      />
                                    ) : (
                                      <span className="font-bold">{rec.cie2} / 25</span>
                                    )}
                                  </td>
                                </tr>
                              );
                            })}
                          </tbody>
                        </table>
                      </div>
                    </div>
                  )}
                </div>
              )}

              {/* --- 3. SLOT-BASED BOOKINGS & APPROVAL QUEUE --- */}
              {activeTab === 'bookings' && (
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6 animate-fade-in">
                  <div className="lg:col-span-5 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm h-fit">
                    <div className="mb-5">
                      <h3 className="text-sm font-bold text-slate-800">Slot-Based Reservation Engine</h3>
                      <p className="text-xs text-slate-500">Checks conflicts by exact Facility, Date, and Period Slot.</p>
                    </div>

                    {bookingStatusMsg && (
                      <div className={`mb-4 p-3 rounded-lg text-xs font-semibold border ${
                        bookingStatusMsg.type === 'error' ? 'bg-rose-50 border-rose-200 text-rose-700' : 'bg-emerald-50 border-emerald-200 text-emerald-700'
                      }`}>
                        {bookingStatusMsg.text}
                      </div>
                    )}

                    <form onSubmit={handleSimulateBooking} className="space-y-3.5">
                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">Select Facility / Room</label>
                        <select
                          value={bookingDetails.resourceId}
                          onChange={(e) => setBookingDetails({ ...bookingDetails, resourceId: e.target.value })}
                          className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-semibold text-slate-800"
                        >
                          {resources.map(r => (
                            <option key={r.id} value={r.id}>{r.name} ({r.capacity} Seats)</option>
                          ))}
                        </select>
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">Reserved By</label>
                        <input
                          type="text"
                          value={bookingDetails.user}
                          onChange={(e) => setBookingDetails({ ...bookingDetails, user: e.target.value })}
                          className="w-full px-3 py-2 bg-slate-100 border border-slate-200 rounded-lg text-xs text-slate-700 font-semibold"
                          required
                        />
                      </div>

                      <div className="grid grid-cols-2 gap-3">
                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Date</label>
                          <input
                            type="date"
                            value={bookingDetails.date}
                            onChange={(e) => setBookingDetails({ ...bookingDetails, date: e.target.value })}
                            className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-semibold text-slate-800"
                            required
                          />
                        </div>
                        <div>
                          <label className="block text-xs font-semibold text-slate-700 mb-1">Time Slot</label>
                          <select
                            value={bookingDetails.timeSlot}
                            onChange={(e) => setBookingDetails({ ...bookingDetails, timeSlot: e.target.value })}
                            className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-semibold text-slate-800"
                          >
                            <option>08:00 am To 8.50 am</option>
                            <option>08.50 am To 9.40 am</option>
                            <option>10.10 am To 11.00 am</option>
                            <option>11.00 am To 11.50 am</option>
                            <option>01.40 pm To 2.30 pm</option>
                          </select>
                        </div>
                      </div>

                      <div>
                        <label className="block text-xs font-semibold text-slate-700 mb-1">Purpose / Event Title</label>
                        <input
                          type="text"
                          placeholder="e.g. OS Mini-Project Lab / ACM Workshop"
                          value={bookingDetails.purpose}
                          onChange={(e) => setBookingDetails({ ...bookingDetails, purpose: e.target.value })}
                          className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs"
                          required
                        />
                      </div>

                      <button type="submit" className="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold shadow-md transition-all">
                        {permissions.canApproveBookings ? 'Confirm & Approve Slot' : 'Submit Booking Request'}
                      </button>
                    </form>
                  </div>

                  <div className="lg:col-span-7 bg-white rounded-2xl border border-slate-200 overflow-x-auto shadow-sm h-fit">
                    <div className="p-5 border-b border-slate-200 flex items-center justify-between">
                      <div>
                        <h3 className="text-sm font-bold text-slate-800">Active Slot Reservations & Approval Queue ({bookings.length})</h3>
                        <p className="text-xs text-slate-500">Admin & Staff can approve or reject pending student/faculty slot requests.</p>
                      </div>
                    </div>
                    <table className="w-full text-left text-xs">
                      <thead className="bg-slate-50 border-b border-slate-200 text-slate-500 uppercase font-semibold">
                        <tr>
                          <th className="p-3.5">Facility & Purpose</th>
                          <th className="p-3.5">Date & Slot</th>
                          <th className="p-3.5">Requested By</th>
                          <th className="p-3.5">Status</th>
                          <th className="p-3.5 text-right">Actions</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-slate-200">
                        {bookings.map(b => (
                          <tr key={b.id} className="hover:bg-slate-50">
                            <td className="p-3.5">
                              <span className="font-bold text-slate-800 block">{b.resourceName}</span>
