            <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
              <div className="bg-white rounded-2xl p-6 max-w-md w-full shadow-2xl animate-fade-in border border-slate-100">
                <div className="flex justify-between items-center mb-4">
                  <h3 className="font-bold text-slate-800 text-sm capitalize">
                    {modalType.replace(/([A-Z])/g, ' $1')}
                  </h3>
                  <button type="button" onClick={() => setModalType(null)} aria-label="Close modal" className="text-slate-400 hover:text-slate-600 font-bold">✕</button>
                </div>

                {/* BULK CSV STUDENT IMPORT MODAL */}
                {modalType === 'bulkCsvStudent' && permissions.canManageStudents && (
                  <form onSubmit={handleBulkCsvImport} className="space-y-3">
                    <p className="text-xs text-slate-500">
                      Paste one student per line in CSV format: <code className="bg-slate-100 px-1 rounded">USN, Name, Email, Password, Phone</code>
                    </p>
                    <textarea
                      rows="5"
                      value={csvInput}
                      onChange={(e) => setCsvInput(e.target.value)}
                      className="w-full p-3 bg-slate-50 border border-slate-200 rounded-lg text-xs font-mono focus:ring-2 focus:ring-indigo-500"
                      required
                    />
                    <button type="submit" className="w-full py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-semibold shadow-md">
                      Import Students from CSV
                    </button>
                  </form>
                )}

                {/* EDIT TIMETABLE SLOT MODAL */}
                {modalType === 'editTimetableSlot' && editingSlot && permissions.canEditTimetable && (
                  <form onSubmit={handleSaveTimetableSlot} className="space-y-3">
                    <div className="text-xs text-slate-500 font-semibold">{editingSlot.day} • {editingSlot.slot}</div>
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Subject Code</label>
                      <input type="text" value={editingSlot.code} onChange={e => setEditingSlot({...editingSlot, code: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-mono" required />
                    </div>
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Subject / Lab Title</label>
                      <input type="text" value={editingSlot.subject} onChange={e => setEditingSlot({...editingSlot, subject: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Faculty</label>
                        <input type="text" value={editingSlot.faculty} onChange={e => setEditingSlot({...editingSlot, faculty: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                      </div>
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Room / Lab</label>
                        <input type="text" value={editingSlot.room} onChange={e => setEditingSlot({...editingSlot, room: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                      </div>
                    </div>
                    <button type="submit" className="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold">Save Timetable Slot</button>
                  </form>
                )}

                {/* ADD NOTICE MODAL */}
                {modalType === 'addNotice' && permissions.canPostNotices && (
                  <form onSubmit={handleAddNotice} className="space-y-3">
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Title</label>
                      <input type="text" placeholder="e.g. OS Lab Assignment 2" value={newNotice.title} onChange={e => setNewNotice({...newNotice, title: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Subject Code</label>
                        <select value={newNotice.courseCode} onChange={e => setNewNotice({...newNotice, courseCode: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs">
                          <option value="ALL">ALL (General)</option>
                          {courses.map(c => <option key={c.id} value={c.id}>{c.id}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Category</label>
                        <select value={newNotice.category} onChange={e => setNewNotice({...newNotice, category: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs">
                          <option>Circular</option>
                          <option>Assignment</option>
                          <option>Study Material</option>
                        </select>
                      </div>
                    </div>
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Due Date</label>
                      <input type="date" value={newNotice.dueDate} onChange={e => setNewNotice({...newNotice, dueDate: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    </div>
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Details / Instructions</label>
                      <textarea rows="3" value={newNotice.content} onChange={e => setNewNotice({...newNotice, content: e.target.value})} className="w-full p-2.5 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    </div>
                    <button type="submit" className="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold">Publish to Notice Hub</button>
                  </form>
                )}

                {/* ADD STUDENT MODAL */}
                {modalType === 'addStudent' && permissions.canManageStudents && (
                  <form onSubmit={handleAddStudent} className="space-y-3">
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">USN Number</label>
                        <input type="text" placeholder="24GMU23CS005" value={newStudent.usn} onChange={e => setNewStudent({...newStudent, usn: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-mono uppercase" required />
                      </div>
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Student Full Name</label>
                        <input type="text" value={newStudent.name} onChange={e => setNewStudent({...newStudent, name: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Email</label>
                        <input type="email" value={newStudent.email} onChange={e => setNewStudent({...newStudent, email: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                      </div>
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Login Password</label>
                        <input type="text" value={newStudent.password} onChange={e => setNewStudent({...newStudent, password: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-mono" required />
                      </div>
                    </div>
                    <div>
                      <label className="block text-[11px] font-semibold text-slate-600 mb-1">Phone</label>
                      <input type="text" value={newStudent.phone} onChange={e => setNewStudent({...newStudent, phone: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    </div>
                    <button type="submit" className="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold">Register Student & USN Login</button>
                  </form>
                )}

                {/* EDIT STUDENT MODAL */}
                {modalType === 'editStudent' && editingStudent && permissions.canManageStudents && (
                  <form onSubmit={handleUpdateStudent} className="space-y-3">
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">USN Number</label>
                        <input type="text" value={editingStudent.usn || ''} onChange={e => setEditingStudent({...editingStudent, usn: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-mono uppercase" required />
                      </div>
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Full Name</label>
                        <input type="text" value={editingStudent.name} onChange={e => setEditingStudent({...editingStudent, name: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                      </div>
                    </div>
                    <div className="grid grid-cols-2 gap-2">
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Email</label>
                        <input type="email" value={editingStudent.email} onChange={e => setEditingStudent({...editingStudent, email: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                      </div>
                      <div>
                        <label className="block text-[11px] font-semibold text-slate-600 mb-1">Login Password</label>
                        <input type="text" value={editingStudent.password || ''} onChange={e => setEditingStudent({...editingStudent, password: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-mono" required />
                      </div>
                    </div>
                    <button type="submit" className="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-semibold">Update Student</button>
                  </form>
                )}

                {/* ADD / EDIT FACULTY, COURSE, RESOURCE, ACTIVITY MODALS */}
                {modalType === 'addFaculty' && permissions.canManageFaculty && (
                  <form onSubmit={handleAddFaculty} className="space-y-3">
                    <input type="text" placeholder="Faculty Name" value={newFaculty.name} onChange={e => setNewFaculty({...newFaculty, name: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    <input type="email" placeholder="Email" value={newFaculty.email} onChange={e => setNewFaculty({...newFaculty, email: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    <input type="text" placeholder="Assigned Password" value={newFaculty.password} onChange={e => setNewFaculty({...newFaculty, password: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-mono" required />
                    <input type="text" placeholder="Course Coordinator" value={newFaculty.courseCoordinator} onChange={e => setNewFaculty({...newFaculty, courseCoordinator: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    <button type="submit" className="w-full py-2 bg-indigo-600 text-white rounded-lg text-xs font-semibold">Register Faculty</button>
                  </form>
                )}

                {modalType === 'editFaculty' && editingFaculty && permissions.canManageFaculty && (
                  <form onSubmit={handleUpdateFaculty} className="space-y-3">
                    <input type="text" value={editingFaculty.name} onChange={e => setEditingFaculty({...editingFaculty, name: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    <input type="text" value={editingFaculty.password || ''} onChange={e => setEditingFaculty({...editingFaculty, password: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-mono" required />
                    <input type="text" value={editingFaculty.courseCoordinator || ''} onChange={e => setEditingFaculty({...editingFaculty, courseCoordinator: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    <button type="submit" className="w-full py-2 bg-indigo-600 text-white rounded-lg text-xs font-semibold">Update Faculty</button>
                  </form>
                )}

                {modalType === 'addCourse' && (
                  <form onSubmit={handleAddCourse} className="space-y-3">
                    <input type="text" placeholder="Subject Code (e.g. UE25CS2305)" value={newCourse.id} onChange={e => setNewCourse({...newCourse, id: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    <input type="text" placeholder="Subject Name" value={newCourse.title} onChange={e => setNewCourse({...newCourse, title: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    <input type="text" placeholder="Course Coordinator" value={newCourse.faculty} onChange={e => setNewCourse({...newCourse, faculty: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    <div className="grid grid-cols-2 gap-2">
                      <input type="text" placeholder="L:3 T:0 P:0" value={newCourse.ltp} onChange={e => setNewCourse({...newCourse, ltp: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs font-mono" required />
                      <input type="number" placeholder="Credits" value={newCourse.credits} onChange={e => setNewCourse({...newCourse, credits: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    </div>
                    <button type="submit" className="w-full py-2 bg-indigo-600 text-white rounded-lg text-xs font-semibold">Save Course</button>
                  </form>
                )}

                {modalType === 'editCourse' && editingCourse && (
                  <form onSubmit={handleUpdateCourse} className="space-y-3">
                    <input type="text" value={editingCourse.title} onChange={e => setEditingCourse({...editingCourse, title: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    <input type="text" value={editingCourse.faculty} onChange={e => setEditingCourse({...editingCourse, faculty: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    <input type="number" value={editingCourse.credits} onChange={e => setEditingCourse({...editingCourse, credits: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    <button type="submit" className="w-full py-2 bg-indigo-600 text-white rounded-lg text-xs font-semibold">Update Course</button>
                  </form>
                )}

                {modalType === 'addResource' && (
                  <form onSubmit={handleAddResource} className="space-y-3">
                    <input type="text" placeholder="Facility Name" value={newResource.name} onChange={e => setNewResource({...newResource, name: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    <input type="text" placeholder="Category" value={newResource.category} onChange={e => setNewResource({...newResource, category: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    <input type="number" placeholder="Capacity" value={newResource.capacity} onChange={e => setNewResource({...newResource, capacity: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    <input type="text" placeholder="Specifications" value={newResource.specs} onChange={e => setNewResource({...newResource, specs: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" />
                    <button type="submit" className="w-full py-2 bg-indigo-600 text-white rounded-lg text-xs font-semibold">Save Resource</button>
                  </form>
                )}

                {modalType === 'editResource' && editingResource && (
                  <form onSubmit={handleUpdateResource} className="space-y-3">
                    <input type="text" value={editingResource.name} onChange={e => setEditingResource({...editingResource, name: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    <select value={editingResource.status} onChange={e => setEditingResource({...editingResource, status: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs">
                      <option>Available</option>
                      <option>Maintenance</option>
                    </select>
                    <button type="submit" className="w-full py-2 bg-indigo-600 text-white rounded-lg text-xs font-semibold">Update Resource</button>
                  </form>
                )}

                {modalType === 'addActivity' && (
                  <form onSubmit={handleAddActivity} className="space-y-3">
                    <input type="text" placeholder="Event Name" value={newActivity.name} onChange={e => setNewActivity({...newActivity, name: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    <input type="date" value={newActivity.date} onChange={e => setNewActivity({...newActivity, date: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    <input type="text" placeholder="Venue" value={newActivity.venue} onChange={e => setNewActivity({...newActivity, venue: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    <input type="text" placeholder="Organizer" value={newActivity.organizer} onChange={e => setNewActivity({...newActivity, organizer: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    <button type="submit" className="w-full py-2 bg-indigo-600 text-white rounded-lg text-xs font-semibold">Save Event</button>
                  </form>
                )}

                {modalType === 'editActivity' && editingActivity && (
                  <form onSubmit={handleUpdateActivity} className="space-y-3">
                    <input type="text" value={editingActivity.name} onChange={e => setEditingActivity({...editingActivity, name: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    <input type="text" value={editingActivity.venue} onChange={e => setEditingActivity({...editingActivity, venue: e.target.value})} className="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-xs" required />
                    <button type="submit" className="w-full py-2 bg-indigo-600 text-white rounded-lg text-xs font-semibold">Update Event</button>
                  </form>
                )}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
